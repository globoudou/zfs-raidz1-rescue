set default=0
set timeout=20

insmod all_video
insmod gfxterm
insmod part_gpt
insmod part_msdos
insmod iso9660

menuentry "Recuperation ZFS — protection en ecriture ACTIVE (recommande)" {
    linux  /live/vmlinuz boot=live components quiet
    initrd /live/initrd.img
}

menuentry "Recuperation ZFS — charger en memoire (la cle peut etre retiree)" {
    linux  /live/vmlinuz boot=live components quiet toram
    initrd /live/initrd.img
}

menuentry "Recuperation ZFS — demarrage verbeux (diagnostic)" {
    linux  /live/vmlinuz boot=live components
    initrd /live/initrd.img
}

menuentry "Recuperation ZFS — SANS protection en ecriture (DANGEREUX)" {
    linux  /live/vmlinuz boot=live components quiet zfsrescue.noro
    initrd /live/initrd.img
}

menuentry "Redemarrer" { reboot }
menuentry "Eteindre"   { halt }
